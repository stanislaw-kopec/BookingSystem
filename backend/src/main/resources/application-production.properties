# Trust X-Forwarded-* headers supplied by the deployment reverse proxy.
server.forward-headers-strategy=framework

# HTTPS is terminated by the edge proxy. Disable this only for a local HTTP smoke test.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# API documentation can be enabled temporarily for a trusted deployment.
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

# The first production start creates one administrator. Existing administrators are never changed.
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
