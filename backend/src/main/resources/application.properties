spring.application.name=auto-service-api

# When running Spring from the IDE or Maven, manage only the database container.
spring.docker.compose.start.arguments=postgres
spring.docker.compose.stop.arguments=postgres

# Docker and the frontend use this endpoint to check backend/database readiness.
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
